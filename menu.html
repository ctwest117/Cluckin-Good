                    <figure class="image">
                        <a href="#">

                            <img src="resources/images/01_cluckin_good_menu.jpg" alt="the CLuckin' Good Burger">
                            <figcaption>1. The Cluckin' Good</figcaption></figure>
                            <p class="meat">Our signature burger — a juicy beef patty, American cheese, lettuce, tomato, pickles,and onion.</p>

                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">

                            <p class="meat">Two smashed beef patties, double cheese, pickles, grilled onions, and special sauce.</p>
                            <p class="bun"></p>
                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">

                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">
                            <img src="resources/images/04_cluckin_good_menu.jpg" alt="Not Burgers">

                            <p class="meat">Beef patty, cheddar, crispy bacon, onion rings, and smoky BBQ sauce.</p>

                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">
                            <img src="resources/images/05_cluckin_good_menu.jpg" alt="Not Burgers">
                            <figcaption>5. Moo-shroom Melt</figcaption></figure>
                            <p class="meat">Beef patty, Swiss cheese, sautéed mushrooms, caramelized onions, and garlic sauce.</p>
                            <p class="bun"></p>
                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">
                            <img src="resources/images/06_cluckin_good_menu.jpg" alt="Not Burgers">
                            <figcaption>6. The Last Moo</figcaption></figure>
                            <p class="meat">A massive burger with two patties, pepper jack, jalapeños, bacon, BBQ sauce, and crispy onions.</p>
                            <p class="bun"></p>
                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">
                            <img src="resources/images/07_cluckin_good_menu.jpg" alt="Not Burgers">
                            <figcaption>7. Steak Your Claim</figcaption></figure>
                            <p class="meat">A grilled 12oz steak served with seasoned fries and your choice of steak sauce.</p>
                            <p class="bun"></p>
                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">
                            <img src="resources/images/08_cluckin_good_menu.jpg" alt="Not Burgers">
                            <figcaption>8. The Rib Tickler</figcaption></figure>
                            <p class="meat">Slow-cooked beef ribs glazed in our signature BBQ sauce, served with fries and slaw.</p>
                            <p class="bun"></p>
                        </a>
                    </figure>
                    <figure class="image">
                        <a href="#"><figure class="im">
                            <img src="resources/images/10_cluckin_good_menu.jpg" alt="Not Burgers">
                            <figcaption>9. Udderly Loaded Fries</figcaption></figure>
                            <p class="meat">Crispy fries covered in melted cheese, seasoned ground beef, bacon, onions, pickles, and Cluckin' Sauce.</p>

                        </a>
